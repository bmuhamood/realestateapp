# render.yaml - Root of your repository

services:
  # Backend API Service
  - type: web
    name: metro-properties-api
    runtime: python
    repo: https://github.com/bmuhamood/realestateapp
    branch: master
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: gunicorn realestate.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: realestate.settings
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: metro-properties-db
          property: connectionString

  # PostgreSQL Database
  - type: postgresql
    name: metro-properties-db
    database: metro_properties
    user: metro_user
    plan: free
    ipAllowList: []
    postgresqlMajorVersion: 15

  # Frontend Static Site (if you have React/Vue build output)
  - type: static
    name: metro-properties-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://metro-properties-api.onrender.com