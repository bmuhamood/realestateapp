databases:
  - name: metro_propertiesdb
    plan: free
    databaseName: metro_properties
    user: Metro Properties

services:
  - type: web
    plan: free
    name: metro-properties-backend
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn mysite.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metro_propertiesdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4